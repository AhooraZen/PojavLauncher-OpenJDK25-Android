name: Build OpenJDK 25 for PojavLauncher (Android 16 / 16KB Page Aligned)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Java Target Version'
        required: true
        default: '25'
      ndk_version:
        description: 'Android NDK Version'
        required: true
        default: 'r28c'

permissions:
  contents: write

jobs:
  build_android:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: ["aarch64"]
      fail-fast: false

    name: "Build OpenJDK 25 - Android ${{ matrix.arch }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Boot JDK
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'

      - name: Set Boot JDK Environment Variables
        run: |
          echo "BOOT_JDK=$JAVA_HOME" >> $GITHUB_ENV

      - name: Install Host Build Dependencies
        run: |
          sudo apt update
          sudo apt -y install \
            autoconf automake libtool pkg-config \
            python3 python-is-python3 unzip zip \
            systemtap-sdt-dev clang lld llvm \
            libasound2-dev libelf-dev libfontconfig1-dev \
            libx11-dev libxext-dev libxrandr-dev libxrender-dev libxtst-dev libxt-dev \
            build-essential xz-utils curl git

      - name: Setup Android NDK ${{ github.event.inputs.ndk_version || 'r28c' }}
        run: |
          NDK_VER="${{ github.event.inputs.ndk_version || 'r28c' }}"
          echo "Downloading Android NDK $NDK_VER..."
          curl -sSL "https://dl.google.com/android/repository/android-ndk-${NDK_VER}-linux.zip" -o ndk.zip
          unzip -q ndk.zip -d "$GITHUB_WORKSPACE"
          rm ndk.zip
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-$NDK_VER" >> $GITHUB_ENV

      - name: Make Scripts Executable
        run: chmod +x scripts/*.sh

      - name: Compile and Package OpenJDK 25
        run: |
          bash scripts/build_all.sh ${{ matrix.arch }}

      - name: Upload OpenJDK 25 Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "openjdk-25-${{ matrix.arch }}-android16"
          path: "openjdk-25-*.tar.xz"
          if-no-files-found: error

  release:
    needs: build_android
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: Flatten Artifacts Directory
        run: |
          mkdir -p final_assets
          find release_artifacts -name "*.tar.xz" -exec cp {} final_assets/ \;
          ls -lh final_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: final_assets/*.tar.xz
          tag_name: ${{ github.ref_name || 'rolling-latest' }}
          name: "OpenJDK 25 for Android 16 (PojavLauncher)"
          body: |
            ### OpenJDK 25 Android 16 (16KB Page Aligned)
            - Built with Android NDK r28+ (16KB ELF segment alignment compliant for Android 15/16).
            - Packaged as standalone `.tar.xz` archives.
            - Architectures: `aarch64`, `arm`, `x86_64`, `x86`.
          draft: false
          prerelease: false
